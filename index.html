<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shahouda Challenge</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#ffd6e7,#e8d7ff);
}

.box{
  background:white;
  width:90%;
  max-width:420px;
  padding:30px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 10px 30px #0002;
}

h1{
  color:#b83280;
  font-size:40px;
}

h2{
  color:#b83280;
}

p{
  font-size:22px;
  color:#444;
}

button{
  width:90%;
  padding:15px;
  margin:10px;
  border:none;
  border-radius:20px;
  font-size:18px;
  background:#b83280;
  color:white;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:scale(1.05);
}

.screen{
  display:none;
}

.active{
  display:block;
}

.run{
  position:relative;
}

</style>

</head>

<body>

<div class="box">


<!-- الشاشة 1 -->
<div id="s1" class="screen active">

<h1>شهوددددةةة</h1>

<button onclick="next(2)">
هلا بأفضل ابن عم بالعالم
</button>

<button onclick="next(2)">
Hej bästa kusin i världen
</button>

</div>



<!-- الشاشة 2 -->
<div id="s2" class="screen">

<h2>السؤال الثاني</h2>

<p>مين أحسن ابن عم بالعالم؟</p>

<button onclick="next(3)">
محمد
</button>

<button id="mustafa" class="run" onmouseover="escapeBtn('mustafa')">
مصطفى
</button>

</div>



<script>

function next(num){

document.querySelectorAll(".screen").forEach(function(x){
x.classList.remove("active");
});

document.getElementById("s"+num).classList.add("active");

}


function escapeBtn(id){

let btn=document.getElementById(id);

btn.style.left=(Math.random()*200-100)+"px";
btn.style.top=(Math.random()*100-50)+"px";

}

</script>


</div>

</body>
</html>
