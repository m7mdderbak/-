<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shahouda Challenge</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #e8d7ff);
}

.box {
  background: white;
  width: 85%;
  max-width: 400px;
  padding: 30px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 10px 30px #0002;
}

h1 {
  font-size: 45px;
  color: #b83280;
  margin-bottom: 30px;
}

button {
  width: 90%;
  padding: 15px;
  margin: 10px;
  border: none;
  border-radius: 20px;
  font-size: 18px;
  background: #b83280;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}
</style>

</head>

<body>

<div class="box">
  <h1>شهوددددةةة</h1>

  <button onclick="next()">هلا بأفضل ابن عم بالعالم</button>

  <button onclick="next()">Hej bästa kusin i världen</button>
</div>


<script>
function next(){
  alert("بدأ التحدي");
}
</script>

</body>
</html>
